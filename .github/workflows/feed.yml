name: Daily job feed

on:
  schedule:
    - cron: "17 9 * * *"   # 9:17 UTC = 4:17 am Toronto in winter, 5:17 am in summer (before the 6:12 am morning run)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "companies.csv"
      - "scraper/**"
      - ".github/workflows/feed.yml"

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python3 scraper/feed.py
      - name: Commit feed
        run: |
          git config user.name "job-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
