name: Daily job feed

on:
  schedule:
    # GitHub can start scheduled runs hours late, so three runs overnight make sure
    # one lands before the 6:12 am Toronto morning run (11:12 UTC in winter, 10:12 in summer).
    - cron: "23 3 * * *"
    - cron: "41 6 * * *"
    - cron: "53 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "companies.csv"
      - "scraper/**"
      - ".github/workflows/feed.yml"

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python3 scraper/feed.py
      - name: Commit feed
        run: |
          git config user.name "job-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit on top of the latest main so overlapping runs never conflict:
          # the newest feed simply replaces the files.
          git fetch origin main
          git reset --soft origin/main
          git add feed
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi
